# Baut den Windows-Installer auf GitHub: Tests, PyInstaller, Selbsttest (ohne Fenster), Inno Setup.
# Ein Versions-Tag v* veröffentlicht das Release mit Installer, Prüfsumme und Notes aus CHANGELOG.md.
# Von Hand gestartet (Actions → Release → Run workflow) entsteht nur ein Build zum Herunterladen und Prüfen.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Tag passt zur Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (python packaging/build_tools.py print-version).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zur Version $version" }

      - name: Build
        shell: powershell
        run: .\packaging\build.ps1 -SkipWindowTest

      - name: Release-Notes
        run: python packaging/build_tools.py release-notes dist/release-notes.md

      - uses: actions/upload-artifact@v5
        with:
          name: Zotivity-Setup
          path: |
            dist/Zotivity-Setup-*.exe
            dist/Zotivity-Setup-*.exe.sha256
            dist/zotivity-update.json
            dist/release-notes.md

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python packaging/build_tools.py print-version).Trim()
          gh release create "${{ github.ref_name }}" "dist/Zotivity-Setup-$version.exe" "dist/Zotivity-Setup-$version.exe.sha256" `
            --title "Zotivity $version" --notes-file dist/release-notes.md --verify-tag
